body{
  margin:0;
  background:#111;
  font-family:sans-serif;
  color:#fff;
}

/* ===== 카테고리 ===== */
.category{
  text-align:center;
  padding:30px 20px 10px;
}

.category button{
  background:none;
  border:1px solid #fff;
  color:#fff;
  padding:10px 20px;
  margin:5px;
  cursor:pointer;
  border-radius:20px;
  transition:all .3s;
}

.category button.active,
.category button:hover{
  background:red;
  border:1px solid red;
  color:#fff;
}

/* ===== Masonry ===== */
.gallery{
  display:flex;
  gap:16px;
  padding:20px;
}

.column{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:16px;
}

.item{
  cursor:pointer;
  position:relative;
  cursor: pointer;
  transition: all 0.2s ease;
}

    .item:hover {
      transform: scale(1.02);
    }
    .item:hover::after { background:red; }


.item img{
  width:100%;
  display:block;
  border-radius:10px;
}

/* ▶ 아이콘 */
.item::after{
  content:"▶";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:30px;
  background:rgba(0,0,0,0.6);
  width:50px;
  height:50px;
  line-height:55px; 
  text-align:center;
  /* display:flex;
  align-items:center;
  justify-content:center; */
  border-radius:50%;
  transition: all 0.2s ease;
}

/* ===== Lightbox ===== */
.lightbox{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.lightbox video,
.lightbox iframe{
  width:80vw;
  height:45vw;
  max-width:900px;
  max-height:500px;
  border-radius:10px;
}

.close{
  position:absolute;
  top:30px;
  right:30px;
  font-size:30px;
  cursor:pointer;
}

<script>
const gallery = document.getElementById('gallery');
let allItems = Array.from(document.querySelectorAll('.item'));
let currentFilter = "all";

/* ===== Masonry ===== */
function createMasonry(){
  gallery.innerHTML = "";

  const visibleItems = allItems.filter(item=>{
    return currentFilter === "all" || item.dataset.category === currentFilter;
  });

  /* =========================
     ⭐ 릴스 → GRID (별도 처리)
  ========================= */
  if(currentFilter === "reels"){
    
    gallery.style.display = "grid";
    gallery.style.gridTemplateColumns = "repeat(5, 1fr)";
    gallery.style.gap = "16px";

    // 반응형
    if(window.innerWidth < 1200){
      gallery.style.gridTemplateColumns = "repeat(4, 1fr)";
    }
    if(window.innerWidth < 900){
      gallery.style.gridTemplateColumns = "repeat(3, 1fr)";
    }
    if(window.innerWidth < 600){
      gallery.style.gridTemplateColumns = "repeat(2, 1fr)";
    }

    visibleItems.forEach(item=>{
      gallery.appendChild(item);
    });

    return; // ⭐ masonry 실행 막기
  }

    /* =========================
     ⭐ DID → GRID (별도 처리)
  ========================= */

    if(currentFilter === "did"){
    
    gallery.style.display = "grid";
    gallery.style.gridTemplateColumns = "repeat(3, 1fr)";
    gallery.style.gap = "16px";

    // 반응형
    if(window.innerWidth < 1200){
      gallery.style.gridTemplateColumns = "repeat(3, 1fr)";
    }
    if(window.innerWidth < 900){
      gallery.style.gridTemplateColumns = "repeat(2, 1fr)";
    }
    if(window.innerWidth < 600){
      gallery.style.gridTemplateColumns = "repeat(2, 1fr)";
    }

    visibleItems.forEach(item=>{
      gallery.appendChild(item);
    });

    return; // ⭐ masonry 실행 막기
  }
  
      /* =========================
     ⭐ 유튜브 → GRID (별도 처리)
  ========================= */

    if(currentFilter === "youtube"){
    
    gallery.style.display = "grid";
    gallery.style.gridTemplateColumns = "repeat(3, 1fr)";
    gallery.style.gap = "16px";

    // 반응형
    if(window.innerWidth < 1200){
      gallery.style.gridTemplateColumns = "repeat(3, 1fr)";
    }
    if(window.innerWidth < 900){
      gallery.style.gridTemplateColumns = "repeat(2, 1fr)";
    }
    if(window.innerWidth < 600){
      gallery.style.gridTemplateColumns = "repeat(2, 1fr)";
    }

    visibleItems.forEach(item=>{
      gallery.appendChild(item);
    });

    return; // ⭐ masonry 실행 막기
  }

  /* =========================
     ⭐ 나머지 → 기존 masonry
  ========================= */
  gallery.style.display = "flex";

  let columnCount = 4;
  if(window.innerWidth < 1200) columnCount = 3;
  if(window.innerWidth < 768) columnCount = 2;
  if(window.innerWidth < 480) columnCount = 1;

  const columns = [];
  for(let i=0;i<columnCount;i++){
    const col = document.createElement('div');
    col.className = "column";
    gallery.appendChild(col);
    columns.push(col);
  }

  const colHeights = new Array(columnCount).fill(0);

  visibleItems.forEach(item=>{
    const shortest = colHeights.indexOf(Math.min(...colHeights));
    columns[shortest].appendChild(item);
    colHeights[shortest] += item.offsetHeight;
  });
}

/* ===== 이미지 로딩 후 실행 ===== */
window.addEventListener('load', ()=>{
  setTimeout(createMasonry, 100);
});

/* ===== 리사이즈 ===== */
window.addEventListener('resize', ()=>{
  setTimeout(createMasonry, 200);
});

/* ===== 필터 ===== */
document.querySelectorAll('.category button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.category button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');

    currentFilter = btn.dataset.filter;
    createMasonry();
  });
});

/* ===== 라이트박스 ===== */
const lightbox = document.getElementById('lightbox');
const content = document.getElementById('content');

document.addEventListener('click',(e)=>{
  const item = e.target.closest('.item');
  if(!item) return;

  const type = item.dataset.type;
  const src = item.dataset.src;

  content.innerHTML = "";

if(type === "youtube"){
  content.innerHTML = `
    <iframe
      width="900"
      height="500"
      src="${src}?autoplay=1&mute=1&rel=0"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>`;
}

  if(type === "video"){
    content.innerHTML = `<video controls autoplay muted><source src="${src}" type="video/mp4"></video>`;
  }

  lightbox.style.display = "flex";
});

/* 닫기 */
function closeBox(){
  lightbox.style.display = "none";
  content.innerHTML = "";
}

document.getElementById('close').onclick = closeBox;

lightbox.addEventListener('click',(e)=>{
  if(e.target === lightbox) closeBox();
});

document.addEventListener('keydown',(e)=>{
  if(e.key === "Escape") closeBox();
});
</script>
