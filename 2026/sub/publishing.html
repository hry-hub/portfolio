                로고 생성
                ----------------------------------
                */

                portfolioData.forEach((item,index)=>{

                    $('#logoGrid').append(`

                        <div
                        class="logo-item"
                        data-index="${index}">

                            <img src="${item.logo}">

                        </div>

                    `);

                });

                /*
                ----------------------------------
                프로젝트 변경
                ----------------------------------
                */

                function showProject(index){

                    const item = portfolioData[index];

                    const img = document.getElementById('previewImg');

                img.style.transition = 'none';

                img.style.transform = 'translateY(0)';

                    $('#previewImg').css('opacity','0');

                setTimeout(()=>{

                    $('#previewImg')
                    .attr('src',item.image)
                    .css({
                        opacity:1
                    });

                },50);

                    $('#previewTitle').text(item.name);

                    $('#previewYear').text(item.year);

                    $('#previewUrl').text(item.url);

                    $('#previewLink').attr('href',item.url);

                    let tagHTML='';

                    item.tags.forEach(tag=>{

                        tagHTML += `<span>${tag}</span>`;

                    });

                    $('#previewTags').html(tagHTML);

                    $('.logo-item').removeClass('active');

                    $('.logo-item').eq(index).addClass('active');

                }

                /*
                ----------------------------------
                PC 클릭
                모바일 링크이동
                ----------------------------------
                */

                $(document).on('click','.logo-item',function(){

                    const index=$(this).data('index');

                    const item=portfolioData[index];

                    if(window.innerWidth <= 768){

                        window.open(item.url,'_blank');

                        return;
                    }

                    showProject(index);

                });

                /*
                ----------------------------------
                스크롤 프리뷰
                ----------------------------------
                */

                $('.preview-image').on('mouseenter',function(){

                    const img = $(this).find('img')[0];

                    const move =
                    img.offsetHeight -
                    this.offsetHeight;

                    if(move > 0){

                        const duration =
                        move / 500;

                        img.style.transition =
                        `transform ${duration}s linear`;

                        img.style.transform =
                        `translateY(-${move}px)`;

                    }

                });

                $('.preview-image').on('mouseleave',function(){

                    const img=$(this).find('img')[0];

                    img.style.transition =
                    'transform .5s ease';

                    img.style.transform =
                    'translateY(0)';
                });

                /*
                ----------------------------------
                Glow
                ----------------------------------
                */

                $('.preview-image').on('mousemove',function(e){

                    const x=e.offsetX;

                    const y=e.offsetY;

                    $('.glow').css({

                        background:
                        `radial-gradient(
                        circle at ${x}px ${y}px,
                        rgba(255,255,255,.15),
                        transparent 45%)`

                    });

                });

                /*
                ----------------------------------
                초기
                ----------------------------------
                */

                showProject(0);
