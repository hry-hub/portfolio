        /* ==================================
        FEED RENDER
        ================================== */

        let currentFeeds = [];

        function renderFeed(account){

            const data =
            accounts[account];

            currentFeeds =
            data.feeds;

            $('.profile a')
            .attr('href',data.link)
            .text(data.username);

            $('.profile p')
            .html(data.desc);

            $('#instaBtn')
            .attr('href', data.link)
            .text('인스타그램 바로가기');

            $('#feedWrap')
            .html('');

            currentFeeds.forEach((feed,index)=>{

                let iconHtml='';

                if(feed.type==='reel'){

                    iconHtml=`
                    <div class="feed-icon">
                        <img
                        src="img/sns/sns_icon02.png"
                        alt="">
                    </div>
                    `;

                }

                else if(feed.images.length>1){

                    iconHtml=`
                    <div class="feed-icon">
                        <img
                        src="img/sns/sns_icon01.png"
                        alt="">
                    </div>
                    `;

                }

                $('#feedWrap').append(`

                    <div
                    class="feed-item"
                    data-index="${index}">

                        ${iconHtml}

                        <img
                        src="${feed.thumb}"
                        alt="">

                    </div>

                `);

            });

        }


        /* ==================================
        CLICK
        ================================== */

        $(document).on(
        'click',
        '.feed-item',
        function(){

            const index =
            $(this).data('index');

        const feed =
        currentFeeds[index];

            $('#modal')
            .addClass('active');

            if(feed.type === 'image'){

                let slides = '';

                feed.images.forEach(img=>{

                    slides += `

                    <div class="swiper-slide">

                        <img
                        src="${img}"
                        alt="">

                    </div>

                    `;

                });

                $('#modalContent').html(`

                    <div
                    class="swiper popupSwiper">

                        <div
                        class="swiper-wrapper">

                            ${slides}

                        </div>

                        <div class="swiper-button-prev"></div>
                        <div class="swiper-button-next"></div>
                        <div class="swiper-pagination"></div>

                    </div>

                `);

                new Swiper(
                '.popupSwiper',
                {

                    loop:true,

                    pagination:{
                        el:'.swiper-pagination',
                        clickable:true
                    },

                    navigation:{
                        nextEl:'.swiper-button-next',
                        prevEl:'.swiper-button-prev'
                    }

                });

            }

            else{

                $('#modalContent').html(`

                    <video
                    controls
                    autoplay
                    playsinline>

                        <source
                        src="${feed.video}"
                        type="video/mp4">

                    </video>

                `);

            }

        });


        /* ==================================
        CLOSE
        ================================== */

        $('#closeBtn').on(
        'click',
        function(){

            closeModal();

        });

        $('#modal').on(
        'click',
        function(e){

            if(e.target === this){

                closeModal();

            }

        });

        $(document).on(
        'keyup',
        function(e){

            if(e.key === 'Escape'){

                closeModal();

            }

        });

        function closeModal(){

            $('#modal')
            .removeClass('active');

            $('#modalContent')
            .html('');

        }

        renderFeed('a');
        </script>
