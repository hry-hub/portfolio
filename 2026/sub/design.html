<!DOCTYPE html>
<html lang="ko">
	<head>
  		<meta charset="UTF-8" />
  		<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  		<title>DESIGN | 디자인 작업물</title>
  		<meta property="og:image" content="myimage.jpg">
  		<link rel="SHORTCUT ICON" href="../favicon.ico" />
  		<meta name="description" content="SUNHEE 포트폴리오">
  		<meta property="og:description" content="SUNHEE 포트폴리오">

          <!--CSS-->
        <link rel="stylesheet" href="../css/style.css" type="text/css">
        <link rel="stylesheet" href="css/sns.css" type="text/css">
        <link rel="stylesheet" href="../css/fonts.css" type="text/css">

	</head>

	<body>

		<div class="gallery">

			<div class="item"><img src="img/design/jm_poster02.jpg"></div>
			<div class="item"><img src="img/design/jm_card01.jpg"></div>
			<div class="item"><img src="img/design/jm_xbanner01.jpg"></div>
			<div class="item"><img src="img/design/jm_xbanner02.jpg"></div>
			<div class="item"><img src="img/design/jm_poster01.jpg"></div>
			<div class="item"><img src="img/design/jm_poster03.jpg"></div>
			<div class="item"><img src="img/design/jm_poster04.jpg"></div>
			<div class="item"><img src="img/design/jm_poster02.jpg"></div>
			<div class="item"><img src="img/design/jm_xbanner03.jpg"></div>
			<div class="item"><img src="img/design/jm_product01.jpg"></div>
			<div class="item"><img src="img/design/jm_poster02.jpg"></div>
			<div class="item"><img src="img/design/jm_poster02.jpg"></div>

		</div>

		<!-- Lightbox -->
		<div id="lightbox" class="lightbox">
			<img id="lightbox-img" />
		</div>

		<script>
			const items = document.querySelectorAll('.item');
			const lightbox = document.getElementById('lightbox');
			const lightboxImg = document.getElementById('lightbox-img');

			// 이미지 클릭 → 확대
			items.forEach(item => {
				item.addEventListener('click', () => {
				const img = item.querySelector('img');
				lightboxImg.src = img.src;
				lightbox.style.display = 'flex';
				});
			});

			// 바깥 클릭 → 닫기
			lightbox.addEventListener('click', () => {
				lightbox.style.display = 'none';
			});
		</script>

	</body>
</html>
