<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instagram Feed Portfolio</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:#fff;
    font-family:Pretendard,sans-serif;

    /*드래그막기*/
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
}

a{
    text-decoration:none;
}

img{
    display:block;
    width:100%;

    /*이미지 드래그 막기*/
    -webkit-user-drag: none;
    user-select: none;
    /*pointer-events: none; /* 클릭도 막힘 */
}

.container{
    width:100%;
    max-width:1600px;
    margin:auto;
    padding:80px 20px;
}

.account-tab{

    display:flex;
    justify-content:center;
    gap:10px;

    margin-bottom:40px;

}

.tab-btn{

    background:#222;
    border:1px solid #333;

    color:#fff;

    padding:12px 24px;

    cursor:pointer;

    transition:.3s;

}

.tab-btn.active{

    background:#fff;
    color:#111;

}

/* =========================
   PROFILE
========================= */

.profile{
    text-align:center;
    margin-bottom:60px;
}

.profile a{
    color:#fff;
    font-size:28px;
    font-weight:700;
}

.profile p{
    color:#999;
    margin-top:15px;
    line-height:1.7;
}

.insta-btn{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    margin-top:16px;

    padding:12px 20px;

    border-radius:999px;

    border:0.5px solid #fff;

    font-size:14px!important;

    font-weight:500;

    transition:.3s;
}

.insta-btn:hover{
    background:red;
    border:0.5px solid red;

}

/* =========================
   FEED
========================= */

.feed-wrap{

    display:grid;

    grid-template-columns:
    repeat(6,1fr);

    gap:8px;

}

.feed-item{

    position:relative;

    overflow:hidden;

    cursor:pointer;

    aspect-ratio:3/4;

    background:#222;

}

.feed-item img{

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    transition:.4s;

}

.feed-item:hover img{

    transform:scale(1.05);

}

.feed-item::after{

    content:'';

    position:absolute;
    inset:0;

    background:
    rgba(0,0,0,.03);

}

.feed-icon{

    position:absolute;

    top:10px;
    right:10px;

    width:16px;
    height:16px;

    z-index:5;

    pointer-events:none;

        filter:drop-shadow(
        0 0 3px rgba(0,0,0,.6)
    );


}

.feed-icon img{

    width:100%;
    height:100%;

    object-fit:contain;

}



/* =========================
   MODAL
========================= */

.modal{

    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,.95);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:9999;

}

.modal.active{

    display:flex;

}

.close{

    position:absolute;

    top:20px;
    right:30px;

    background:none;
    border:none;

    color:#fff;

    font-size:42px;

    cursor:pointer;

}

/* =========================
   IMAGE POPUP
========================= */

.modal-content{

    width:min(90vw,500px);

}

.popupSwiper{

    width:100%;

}

.popupSwiper .swiper-slide{

    aspect-ratio:4/5;

    display:flex;

    justify-content:center;
    align-items:center;

}

.popupSwiper .swiper-slide img{

    width:100%;
    height:100%;

    object-fit:contain;

}

/* =========================
   SWIPER
========================= */

.swiper-button-next,
.swiper-button-prev{

    color:#fff;

}

.swiper-pagination-bullet{

    background:#fff;

}

/* =========================
   VIDEO
========================= */

.modal video{

    width:min(90vw,420px);

    max-height:80vh;

    display:block;

}

/* =========================
   TABLET
========================= */

@media(max-width:1024px){

    .feed-wrap{

        grid-template-columns:
        repeat(4,1fr);

    }

}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    .container{

        padding:40px 10px;

    }

    .profile{

        margin-bottom:30px;

    }

    .profile a{

        font-size:22px;

    }

    .feed-wrap{

        grid-template-columns:
        repeat(3,1fr);

        gap:4px;

    }

    .modal-content{

        width:min(94vw,450px);

    }

}

</style>

/* ==================================
   FEED RENDER
================================== */

let currentFeeds = [];

function renderFeed(account){

    const data =
    accounts[account];

    currentFeeds =
    data.feeds;

    $('.profile a')
    .attr('href',data.link)
    .text(data.username);

    $('.profile p')
    .html(data.desc);

    $('#instaBtn')
    .attr('href', data.link)
    .text('인스타그램 바로가기');

    $('#feedWrap')
    .html('');

    currentFeeds.forEach((feed,index)=>{

        let iconHtml='';

        if(feed.type==='reel'){

            iconHtml=`
            <div class="feed-icon">
                <img
                src="img/sns/sns_icon02.png"
                alt="">
            </div>
            `;

        }

        else if(feed.images.length>1){

            iconHtml=`
            <div class="feed-icon">
                <img
                src="img/sns/sns_icon01.png"
                alt="">
            </div>
            `;

        }

        $('#feedWrap').append(`

            <div
            class="feed-item"
            data-index="${index}">

                ${iconHtml}

                <img
                src="${feed.thumb}"
                alt="">

            </div>

        `);

    });

}


/* ==================================
   CLICK
================================== */

$(document).on(
'click',
'.feed-item',
function(){

    const index =
    $(this).data('index');

const feed =
currentFeeds[index];

    $('#modal')
    .addClass('active');

    if(feed.type === 'image'){

        let slides = '';

        feed.images.forEach(img=>{

            slides += `

            <div class="swiper-slide">

                <img
                src="${img}"
                alt="">

            </div>

            `;

        });

        $('#modalContent').html(`

            <div
            class="swiper popupSwiper">

                <div
                class="swiper-wrapper">

                    ${slides}

                </div>

                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
                <div class="swiper-pagination"></div>

            </div>

        `);

        new Swiper(
        '.popupSwiper',
        {

            loop:true,

            pagination:{
                el:'.swiper-pagination',
                clickable:true
            },

            navigation:{
                nextEl:'.swiper-button-next',
                prevEl:'.swiper-button-prev'
            }

        });

    }

    else{

        $('#modalContent').html(`

            <video
            controls
            autoplay
            playsinline>

                <source
                src="${feed.video}"
                type="video/mp4">

            </video>

        `);

    }

});


/* ==================================
   CLOSE
================================== */

$('#closeBtn').on(
'click',
function(){

    closeModal();

});

$('#modal').on(
'click',
function(e){

    if(e.target === this){

        closeModal();

    }

});

$(document).on(
'keyup',
function(e){

    if(e.key === 'Escape'){

        closeModal();

    }

});

function closeModal(){

    $('#modal')
    .removeClass('active');

    $('#modalContent')
    .html('');

}

renderFeed('a');
</script>

    $('.tab-btn')

    renderFeed(
        $(this).data('account')
    );
