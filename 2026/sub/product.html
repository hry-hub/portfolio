<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PRODUCT PAGE | 상세페이지</title>
        <meta property="og:image" content="myimage.jpg">
        <link rel="SHORTCUT ICON" href="../favicon.ico" />
        <meta name="description" content="SUNHEE 포트폴리오">
        <meta property="og:description" content="SUNHEE 포트폴리오">

        <!--CSS-->
        <link rel="stylesheet" href="../css/style.css" type="text/css">
        <link rel="stylesheet" href="css/product.css" type="text/css">
        <link rel="stylesheet" href="../css/fonts.css" type="text/css">
    </head>

    <body>
        <div id="sub-inner">

            <div class="container">
            
                <div class="left"> <!-- 왼쪽 시작-->

                    <!-- 탭 -->
                    <div class="tabs">
                        <div class="tab active" data-index="0">01</div>
                        <div class="tab" data-index="1">02</div>
                        <div class="tab" data-index="2">03</div>
                        <div class="tab" data-index="3">04</div>
                        <div class="tab" data-index="4">05</div>
                        <div class="tab" data-index="5">06</div>
                    </div>

                    <div class="text-area">
                        <h6 id="number"></h6>
                        <h2 id="title"></h2>
                        <p id="desc"></p>
                        <span style="font-size:13px; background:#222; padding:5px 10px; display:inline-block; margin-top:10px;">*고해상도 이미지로 인해 로딩이 다소 느릴 수 있습니다.</span>
                    </div>
                    <div class="phone">
                        <img id="phoneImg" src="">
                    </div>

                </div> <!-- 왼쪽 끝 -->

                <div class="right"> <!-- 오른쪽 시작 -->
                    <div class="grid"> <!-- 4분할 -->
                        <div class="block" id="b1"></div>
                        <div class="block" id="b2"></div>
                        <div class="block" id="b3"></div>
                        <div class="block" id="b4"></div>
                    </div>

                    <div class="mobile-full"> <!-- 모바일 -->
                        <img id="mobileImg" src="">
                    </div>
                </div> <!-- 오른쪽 끝 -->

            </div>

            <script>
            // 데이터
            const pages = [
            {
                phone: 'img/product/phone01.png',
                img: 'img/product/page01.jpg',
                number: 'Page 01',
                title: 'JM 로스팅 공장 투어',
                desc: '제이엠그룹 로스팅 공장 투어 프로그램 페이지.',
                pos: ['0 0%', '0 25%', '0 60%', '0 100%']
            },
            {
                phone: 'img/product/phone02.png',
                img: 'img/product/page02.png',
                number: 'Page 02',
                title: '아이뮨랩 메가루테인',
                desc: '루테인 영양제 상세페이지.',
                pos: ['0 12%', '0 38.2%', '0 83.3%', '0 100%']
            },
            {
                phone: 'img/product/phone03.png',
                img: 'img/product/page03.png',
                number: 'Page 03',
                title: '백년뒤앤 몰입',
                desc: '집중력 영양제 상세페이지.',
                pos: ['0 9%', '0 49%', '0 67%', '0 93.5%']
            },
            {
                phone: 'img/product/phone04.png',
                img: 'img/product/page04.png',
                number: 'Page 04',
                title: '백년뒤앤 중심',
                desc: '균형 영양제 상세페이지.',
                pos: ['0 0%', '0 45%', '0 75%', '0 98%']
            },
            {
                phone: 'img/product/phone05.png',
                img: 'img/product/page05.png',
                number: 'Page 05',
                title: '키르메스 라바텐 프리미엄',
                desc: '키 영양제 상세페이지.',
                pos: ['0 0%', '0 33.5%', '0 54.3%', '0 78%']
            },
            {
                phone: 'img/product/phone06.png',
                img: 'img/product/page06.png',
                number: 'Page 06',
                title: '백년뒤앤 비타민D',
                desc: '비타민D 영양제 상세페이지.',
                pos: ['0 0%', '0 18.3%', '0 73.5%', '0 89%']
            }
            ];

            // 요소
            const tabs = document.querySelectorAll('.tab');
            const phoneImg = document.getElementById('phoneImg');
            const mobileImg = document.getElementById('mobileImg');
            const number = document.getElementById('number');
            const title = document.getElementById('title');
            const desc = document.getElementById('desc');

            const blocks = [
            document.getElementById('b1'),
            document.getElementById('b2'),
            document.getElementById('b3'),
            document.getElementById('b4')
            ];

            // 렌더
            function render(i) {
            const p = pages[i];

            phoneImg.src = p.phone;
            mobileImg.src = p.img;
            number.innerText = p.number;
            title.innerText = p.title;
            desc.innerText = p.desc;

            blocks.forEach((el, idx) => {
                el.style.backgroundImage = `url(${p.img})`;
                el.style.backgroundPosition = p.pos[idx];
            });
            }

            render(0);

                tabs.forEach(tab => {
                    tab.addEventListener('click', () => {

                        tabs.forEach(t => t.classList.remove('active'));
                        tab.classList.add('active');

                        render(tab.dataset.index);

                        // 모바일에서 이미지 맨 위로 이동
                        if(window.innerWidth <= 768){
                            window.scrollTo({
                                top: 0,
                                behavior: 'smooth'
                            });
                        }

                    });
                });
            </script>
        </div>
    </body>
</html>
